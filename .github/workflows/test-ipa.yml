name: Test Twitch IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in this repository
        required: true
        default: v1.5-beta.3
        type: string
      ipa_asset:
        description: Exact IPA asset name
        required: true
        default: TwitchPlus-v1.5-beta.3-Duo-fit-native-ad-recovery-unsigned.ipa
        type: string
      profile:
        description: Package expectations
        type: choice
        options: [beta3, twitchplus, generic]
        default: beta3
      source_tests:
        description: Build release sources, run regressions, and match the packaged library
        type: boolean
        default: true
      compare_base:
        description: Require all members except NativeRewind to match the v1.4 base
        type: boolean
        default: true
  push:
    branches: [tools/ipa-tester-v1]
    paths:
      - .github/workflows/test-ipa.yml
      - tools/test-twitch-ipa.py
      - tests/test_ipa_tester.py
      - IPA-TESTER.md
      - RELEASE-ipa-tester-v1.0.0.md
  pull_request:
    paths:
      - .github/workflows/test-ipa.yml
      - tools/test-twitch-ipa.py
      - tests/test_ipa_tester.py

permissions:
  contents: read

jobs:
  inspector-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test malformed, modified and valid IPA fixtures
        run: python tests/test_ipa_tester.py

  inspect-release:
    needs: inspector-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v1.5-beta.3' }}
      IPA_ASSET: ${{ inputs.ipa_asset || 'TwitchPlus-v1.5-beta.3-Duo-fit-native-ad-recovery-unsigned.ipa' }}
      TEST_PROFILE: ${{ inputs.profile || 'beta3' }}
      RUN_SOURCE: ${{ github.event_name != 'workflow_dispatch' || inputs.source_tests }}
      COMPARE_BASE: ${{ github.event_name != 'workflow_dispatch' || inputs.compare_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release inputs
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'v[0-9A-Za-z.-]+', os.environ['RELEASE_TAG']), 'Invalid release tag'
          assert re.fullmatch(r'[A-Za-z0-9_.-]+\.ipa', os.environ['IPA_ASSET']), 'Expected an exact IPA filename'
          assert os.environ['TEST_PROFILE'] in ('beta3', 'twitchplus', 'generic')
          assert not (os.environ['RUN_SOURCE'] == 'true' and os.environ['TEST_PROFILE'] == 'generic'), 'Disable source tests with generic profile'
          PY
      - name: Download the release asset and its GitHub digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > input/release.json
          python - <<'PY'
          import json, os, pathlib, re
          release = json.loads(pathlib.Path('input/release.json').read_text())
          assets = [asset for asset in release['assets'] if asset['name'] == os.environ['IPA_ASSET']]
          assert len(assets) == 1, 'Expected one matching IPA asset'
          digest = assets[0].get('digest', '')
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest), 'Release has no GitHub SHA-256 digest'
          pathlib.Path('input/expected-sha256.txt').write_text(digest[7:])
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$IPA_ASSET" --dir input
      - name: Download pinned comparison base
        if: env.COMPARE_BASE == 'true'
        run: |
          curl -fL --retry 3 https://github.com/Kite1219/TwitchPlus-AdBlock-Rewind/releases/download/v1.4/TwitchPlus-v1.4-AdBlock-Rewind-Duo-unsigned.ipa -o input/base.ipa
          printf '6d573ecfc6686bed9a15fc061b315cc19ead5f93faab7fc5594d23aa4f104665  input/base.ipa\n' | sha256sum -c -
      - uses: actions/checkout@v4
        if: env.RUN_SOURCE == 'true'
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source-under-test
          persist-credentials: false
      - name: Download pinned native compiler
        if: env.RUN_SOURCE == 'true'
        run: |
          curl -fL --retry 3 https://static.rust-lang.org/dist/2026-10-01/rustc-1.99.0-x86_64-unknown-linux-gnu.tar.xz -o /tmp/rustc.tar.xz
          mkdir -p /tmp/compiler
          tar -xJf /tmp/rustc.tar.xz -C /tmp/compiler
      - name: Inspect, compare and optionally run matching source tests
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          args = [sys.executable, 'tools/test-twitch-ipa.py', 'input/' + os.environ['IPA_ASSET'],
                  '--expect-sha256', pathlib.Path('input/expected-sha256.txt').read_text(),
                  '--profile', os.environ['TEST_PROFILE'], '--output-dir', 'ipa-test-results']
          if os.environ['COMPARE_BASE'] == 'true':
              args += ['--baseline', 'input/base.ipa']
          if os.environ['RUN_SOURCE'] == 'true':
              args += ['--source-tests', '--source-repo', 'source-under-test',
                       '--compiler-root', '/tmp/compiler/rustc-1.99.0-x86_64-unknown-linux-gnu/rustc']
          sys.exit(subprocess.call(args))
          PY
      - name: Summarize the report
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('ipa-test-results/report.json')
          if path.exists():
              report = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## Twitch IPA package report\n\n')
                  out.write('Result: **' + report['result'] + '**\n\n')
                  out.write(str(report['summary']) + '\n\n')
                  out.write('Source commit: `' + report.get('sourceCommit', 'not tested') + '`\n\n')
                  out.write('Device UI, playback and real ad breaks: **not run**. Download the report artifact for details and the manual checklist.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twitch-ipa-test-report
          path: ipa-test-results/
          if-no-files-found: warn
          retention-days: 3

  publish-tester:
    if: github.event_name == 'push' && github.ref == 'refs/heads/tools/ipa-tester-v1'
    needs: inspect-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: twitch-ipa-test-report
          path: tested-report
      - name: Package tester and its verified Beta 3 report
        run: |
          mkdir -p tester-output
          git archive --format=zip --prefix=Twitch-IPA-Tester/ --output tester-output/Twitch-IPA-Tester-v1.0.0.zip HEAD
          cp tested-report/report.html tester-output/Beta3-test-report.html
          cp tested-report/report.json tester-output/Beta3-test-report.json
          cp tested-report/source-tests.log tester-output/Beta3-source-tests.log
          cd tester-output
          sha256sum *.zip *.html *.json *.log > SHA256SUMS.txt
      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ipa-tester-v1.0.0 --draft --target "$GITHUB_SHA" --title 'Twitch IPA Tester v1.0.0' --notes-file RELEASE-ipa-tester-v1.0.0.md
          gh release upload ipa-tester-v1.0.0 tester-output/*
          gh release edit ipa-tester-v1.0.0 --draft=false --latest=false
